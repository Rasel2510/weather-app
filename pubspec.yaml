name: weather_r
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  http: ^1.5.0
  lottie: ^3.3.2
  provider: ^6.0.5
  geocoding: ^4.0.0
  intl: ^0.20.2
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.2.13

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/cloudy.png"
  remove_alpha_ios: true  

flutter_native_splash:
  color: "#2196F3"         
  image: assets/images/cloudy.png
  android: true
  ios: true
  fill: true             
  android_gravity: center   
  ios_content_mode: scaleAspectFill  
  preserve: true          

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lotte/
